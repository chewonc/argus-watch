# Backup scheduler: re-runs any poll that QStash has not run on time.
# GitHub Actions schedules are best-effort (min 5 min; may be delayed/dropped under load; disabled after 60 days of inactivity).
name: heartbeat
on:
  schedule:
    - cron: "7,22,37,52 * * * *" # every 15 min, off the top of the hour to avoid peak delays
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: call heartbeat
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$ADMIN_TOKEN" ]; then echo "secrets not set; skipping"; exit 0; fi
          curl -sS -X POST "$APP_URL/api/admin" -H "authorization: Bearer $ADMIN_TOKEN" -H "content-type: application/json" -d '{"op":"heartbeat"}'
